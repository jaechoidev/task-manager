[package]
name = "factory"
version = "0.1.0"
edition = "2021"
description = "Deterministic task manager: plan validation, issue creation and repo bootstrap"
publish = false

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived. serde_yaml_ng is its maintained continuation.
# All YAML parsing goes through src/yaml.rs, so swapping is one function.
serde_yaml_ng = "0.10"
# "bundled" compiles SQLite in, so the binary has no system dependency.
# "fallible_uint" lets u64 values such as issue numbers be stored directly.
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
# A small synchronous HTTP server for the local API. The engine's own work
# is waiting on agents, so it has no use for an async runtime.
tiny_http = "0.12"

[profile.release]
strip = true
